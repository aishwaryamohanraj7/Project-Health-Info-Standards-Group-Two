<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FHIR ETL Pipeline - ETL</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020617;
    color: white;
}

/* ===== MENU BUTTON ===== */
#menuToggle {
    position: fixed;
    top: 18px;
    left: 18px;
    font-size: 26px;
    cursor: pointer;
    color: #22c55e;
    z-index: 1100;
}

/* ===== OVERLAY (blur background) ===== */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(5px);
    display: none;
    z-index: 900;
}

.overlay.active {
    display: block;
}

/* ===== TOP NAV ===== */
.top-nav {
    position: fixed;
    top: 0;
    right: 0;
    width: 100%;
    display: flex;
    justify-content: flex-end;
    padding: 20px 40px;
    z-index: 999;
}

.top-nav a {
    color: white;
    margin-left: 25px;
    text-decoration: none;
}

.top-nav a:hover {
    color: #22c55e;
}

/* ===== SIDEBAR ===== */
.sidebar {
    position: fixed;
    top: 0;
    left: -100%;   /* FULLY HIDDEN */
    width: 260px;
    height: 100%;
    background: linear-gradient(180deg, #022c22, #020617);
    padding: 90px 20px 20px;
    transition: 0.3s;
    z-index: 1000;
    overflow-y: auto;
}

.sidebar.active {
    left: 0;
}

/* ===== SIDEBAR LINKS ===== */
.sidebar h2 {
    color: #22c55e;
}

.sidebar a {
    display: block;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 25px;
    border: 1px solid #22c55e;
    color: white;
    text-decoration: none;
}

.sidebar a:hover {
    background: #22c55e;
    color: black;
}

.sidebar a.active {
    background: #22c55e;
    color: black;
}

/* ===== MAIN ===== */
.main {
    padding: 120px 60px;
}

/* ===== TASK ===== */
.task {
    display: none;
}

.task.active {
    display: block;
}

.task-box {
    background: #0f172a;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(34,197,94,0.2);
}

h1 {
    margin-bottom: 15px;
}

p {
    color: #d1d5db;
}
</style>
</head>

<body>

<!-- MENU BUTTON -->
<div id="menuToggle" onclick="toggleMenu()">☰</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- TOP NAV -->
<header class="top-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="team.html">Team</a>
    <a href="etl.html">ETL</a>
    <a href="insights.html">Insights</a>
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    <h2>ETL Tasks</h2>

    <!-- ETL -->
    <a href="#" onclick="showTask(event,'extract')">📥 Extract</a>
    <a href="#" onclick="showTask(event,'transform')">⚙️ Transform</a>
    <a href="#" onclick="showTask(event,'load')">📤 Load</a>

    <hr style="border:0.5px solid #1f2937; margin:15px 0;">

    <!-- TASKS -->
    <a href="#" onclick="showTask(event,'task1')" class="active">Task 1</a>
    <a href="#" onclick="showTask(event,'task2')">Task 2</a>
    <a href="#" onclick="showTask(event,'task3')">Task 3</a>
    <a href="#" onclick="showTask(event,'task4')">Task 4</a>
    <a href="#" onclick="showTask(event,'task5')">Task 5</a>

</div>

<!-- MAIN -->
<div class="main">

    <div id="task1" class="task task-box active">
        <h1>Task 1</h1>
        <p>Patient retrieved and loaded.</p>
    </div>

    <div id="task2" class="task task-box">
        <h1>Task 2</h1>
        <p>Condition transformation.</p>
    </div>

    <div id="task3" class="task task-box">
        <h1>Task 3</h1>
        <p>Observation added.</p>
    </div>

    <div id="task4" class="task task-box">
        <h1>Task 4</h1>
        <p>Procedure added.</p>
    </div>

    <div id="task5" class="task task-box">
        <h1>Task 5</h1>
        <p>HL7 message generated.</p>
    </div>

</div>

<script>

function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

function closeMenu() {
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function showTask(event, id) {

    document.querySelectorAll(".task").forEach(t => t.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".sidebar a").forEach(a => a.classList.remove("active"));
    event.target.classList.add("active");

    closeMenu();  // auto close
}

</script>

</body>
</html>
